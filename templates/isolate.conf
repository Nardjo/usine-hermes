# Sandbox for profile __NAME__: only its own home is visible and writable.
[Service]
ProtectSystem=strict
ProtectHome=tmpfs
TemporaryFileSystem=__HOME_ROOT__:ro
BindPaths=__HOME__
ReadWritePaths=__HOME__
ReadOnlyPaths=/usr/local/lib/hermes-agent
PrivateTmp=yes
NoNewPrivileges=yes
ProtectProc=invisible
